name: Validar DApp y Docker
on: [push, pull_request]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:networks
      - run: npm run build
      - run: npm run test:integration
      - run: docker compose config --quiet
      - run: docker build -t juntachain:ci .
      - name: Verificar contenedor
        run: |
          docker run -d --name juntachain-qa -p 3000:3000 juntachain:ci
          curl --fail --retry 12 --retry-delay 3 --retry-connrefused http://localhost:3000/api/health
      - if: always()
        run: docker logs juntachain-qa || true
